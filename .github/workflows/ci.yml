name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  offline-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install hash-locked runtime
        run: python -m pip install --require-hashes -r requirements/runtime-lock.txt
      - name: Install project without dependency drift
        run: python -m pip install -e . --no-deps
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: Public release gate
        run: python scripts/verify_public_release.py
      - name: Package validation
        run: python scripts/validate_package.py
